- insert:
    - id: image2
      name: dsh-image2-tool
      config:
        baseUrl: https://grsaiapi.com/v1
        model: gpt-image-2.5
        quality: auto
        apiKeyEnv: IMAGE2_API_KEY
        autoGenerateAssets: false
        outputDir: imagegen-output
        timeoutMs: 180000
        responseFormat: b64_json
